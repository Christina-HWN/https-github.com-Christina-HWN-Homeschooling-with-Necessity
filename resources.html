
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missouri Homestead Academic Compliance Framework | Homeschooling with Necessity</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Modern, warm organic typography (Plus Jakarta Sans + Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">

    <!-- Custom Tailwind Configuration mapped directly to your organic brand colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Mapped to your brand palette: oatmeal, charcoal, sage green, and terracotta
                        brand: {
                            50: '#fcfbf9',   /* Warm oatmeal canvas */
                            100: '#f4f1ea',  /* Warm earthy alt bg */
                            500: '#2d6a4f',  /* Natural deep sage green */
                            600: '#1b4332',  /* Rich darker pine hover */
                            700: '#153225',
                            800: '#2c3531',  /* Deep forest charcoal */
                            900: '#1e2421',
                        },
                        accent: {
                            400: '#db825e',
                            500: '#c86d4b',  /* Warm terracotta/wood accent */
                            600: '#b05737',
                        },
                        sage: {
                            100: '#eef2f0',
                            500: '#5c6b65',  /* Grounded sage-gray text */
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom Styling & Print Settings -->
    <style>
        /* Base Reset & Custom styles to match existing UI look */
        :root {
            --bg-canvas: #fcfbf9;
            --bg-surface: #ffffff;
            --bg-alt: #f4f1ea;
            --color-text: #2c3531;
            --color-muted: #5c6b65;
            --color-primary: #2d6a4f;
            --color-accent: #c86d4b;
            --border-subtle: #e6e2dd;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--color-text);
        }

        .dropdown-menu {
            display: none;
        }
        .dropdown:hover .dropdown-menu {
            display: block;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .print-full-width { width: 100% !important; max-width: none !important; margin: 0 !important; padding: 0 !important; }
            .page-break { page-break-before: always; }
        }
        
        .gradient-banner {
            background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 50%, #c86d4b 100%);
        }
    </style>
</head>
<body class="font-sans antialiased text-brand-800">
